<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Login - James World</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark" />
    <!-- Google Fonts for premium headers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-container">
    <div class="glass-panel" style="max-width: 380px;">
        <div class="brand-logo-group" style="justify-content: center; margin-bottom: 1.5rem; gap: 12px;">
            <div class="logo-dot"></div>
            <div class="brand-title">
                JAMES WORLD
                <span class="sub">시스템 제어반 로그온</span>
            </div>
        </div>
        
        <form action="/login" method="post" class="flex-column">
            <div class="form-group">
                <label for="username">사용자명</label>
                <input type="text" id="username" name="username" placeholder="Username" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                <input type="checkbox" id="remember_id" style="width: auto; cursor: pointer;">
                <label for="remember_id" style="margin: 0; font-weight: normal; color: #aaa; cursor: pointer;">아이디 저장</label>
            </div>
            
            <button type="submit" class="btn btn-primary mt-4">Login System</button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const savedUsername = localStorage.getItem("savedUsername");
            const usernameInput = document.getElementById("username");
            const rememberCheckbox = document.getElementById("remember_id");

            if (savedUsername) {
                usernameInput.value = savedUsername;
                rememberCheckbox.checked = true;
            }

            document.querySelector("form").addEventListener("submit", function() {
                if (rememberCheckbox.checked) {
                    localStorage.setItem("savedUsername", usernameInput.value);
                } else {
                    localStorage.removeItem("savedUsername");
                }
            });
        });
    </script>
</body>
</html>
