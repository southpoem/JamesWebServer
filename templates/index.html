<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>James World - Control Center</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark" />
    <!-- Google Fonts for premium headers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .settings-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            margin-top: 0.5rem;
        }
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: rgba(56, 189, 248, 0.03);
            border: 1px solid rgba(56, 189, 248, 0.08);
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .settings-key {
            color: var(--text-dim);
            font-weight: 500;
        }
        .settings-val {
            color: var(--hl-blue);
            font-weight: 700;
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 520px;">
        <!-- Header -->
        <header class="brand-header">
            <a href="/" class="brand-logo-group">
                <div class="logo-dot"></div>
                <div class="brand-title">
                    JAMES WORLD
                    <span class="sub">자동 매매 시스템 제어반</span>
                </div>
            </a>
            <div class="meta-pills">
                <span class="pill"><span class="label">System:</span> <b>Active</b></span>
            </div>
        </header>

        <!-- raoni.xyz Top Pill Navigation Bar -->
        <div class="top-nav-row">
            <nav class="top-nav">
                <a href="/" class="nav-link active">제어반</a>
                <a href="/infinite" class="nav-link">대시보드</a>
                <a href="/infinite_charts" class="nav-link">차트 모니터링</a>
                <a href="/infinite_settings" class="nav-link">매매 설정</a>
                <a href="/infinite_help" class="nav-link">전략 가이드</a>
            </nav>
        </div>

        <!-- Settings Info Panel -->
        <div class="glass-panel">
            <div class="panel-title">
                ⚙️ SYSTEM CONFIGURATION
            </div>
            
            {% if settings %}
            <ul class="settings-list">
                {% for key, value in settings.items() %}
                <li class="settings-item">
                    <span class="settings-key">{{ key }}</span>
                    <span class="settings-val">{{ value }}</span>
                </li>
                {% endfor %}
            </ul>
            {% else %}
            <p style="color: var(--text-muted); margin-top: 0.5rem; text-align: center; font-size: 0.85rem;">설정 정보가 없습니다.</p>
            {% endif %}
        </div>

        <!-- Action Control Panel -->
        <div class="glass-panel flex-column">
            <div class="panel-title">
                🎮 SYSTEM ACTIONS
            </div>

            <form action="/run_change_base_usdt" method="post" style="margin: 0;">
                <button type="submit" class="btn btn-secondary">🔄 환율 정보 변경</button>
            </form>
            
            <form action="/infinite" method="post" style="margin: 0;">
                <button type="submit" class="btn btn-primary">⚡ 무한매수 대시보드</button>
            </form>
        </div>

        <!-- Footer -->
        <div class="text-center" style="margin-top: 0.5rem;">
            <a href="/logout" class="back-link" style="color: var(--down);">🔓 시스템 로그아웃</a>
        </div>
    </div>
</body>
</html>
